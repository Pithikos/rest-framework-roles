[tox]
# Matrix of supported Django majors against the Python versions each supports.
#   Django 4.2 LTS : Python 3.9  - 3.12
#   Django 5.2 LTS : Python 3.10 - 3.13
#   Django 6.0     : Python 3.12 - 3.13
env_list =
    py39-dj42
    py310-dj{42,52}
    py311-dj{42,52}
    py312-dj{42,52,60}
    py313-dj{52,60}
skip_missing_interpreters = true

[testenv]
deps =
    dj42: Django>=4.2,<4.3
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    djangorestframework>=3.16
    pytest>=8,<9
    pytest-django>=4.9
    pytest-xdist>=3.6
commands =
    pytest {posargs}

[gh-actions]
# Convenience mapping if the project ever moves to GitHub Actions.
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
