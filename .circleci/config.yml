version: 2.1


jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install tox
          command: pip install tox
      - run:
          name: Run test matrix for this interpreter
          # Derive the tox factor from the image's Python version, e.g. 3.12 -> py312.
          # tox then runs every Django env compatible with this interpreter.
          command: tox -f "py$(echo '<< parameters.python-version >>' | tr -d '.')"

  deploy:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: verify git tag vs. version
          command: python setup.py verify
      - run:
          name: create packages
          command: |
            pip install build twine
            python -m build
      - run:
          name: setup pypi credentials
          command: |
            echo -e "[pypi]" >> ~/.pypirc
            echo -e "username = __token__" >> ~/.pypirc
            echo -e "password = $PYPI_TOKEN" >> ~/.pypirc
      - run:
          name: upload to cheeseshop if a tag found
          command: |
            tag=`git tag --points-at HEAD`
            if [ $tag ]; then
              python -m twine upload dist/*
            fi


workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
          filters:
            branches:
              only: development

  new_release:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
          filters:
            branches:
              only: master
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
      - deploy:
          requires:
            - test-3.9
            - test-3.10
            - test-3.11
            - test-3.12
            - test-3.13
          filters:
            branches:
              only: master
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
